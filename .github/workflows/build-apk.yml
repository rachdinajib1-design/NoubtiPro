name: Build Noubti Pro v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o NoubtiPro_Android_Project_v0.1.zip

      - name: Prepare Android app
        working-directory: NoubtiProAndroid
        run: |
          sed -i "s/applicationId 'ma.noubti.pro'/applicationId 'com.rachdinajib.noubtipro.beta'/" app/build.gradle
          sed -i "s/versionCode 1/versionCode 2/" app/build.gradle
          sed -i "s/versionName '0.1.0'/versionName '0.2.0'/" app/build.gradle
          sed -i "s/targetSdk 35/targetSdk 34/" app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: NoubtiProAndroid
        run: gradle :app:assembleRelease

      - name: Sign APK
        working-directory: NoubtiProAndroid
        run: |
          keytool -genkeypair -v \
            -keystore noubti-test.jks \
            -alias noubti \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Noubti Test,O=Noubti,C=MA"

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          "$ZIPALIGN" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            Noubti-Pro-v0.2-aligned.apk

          "$APKSIGNER" sign \
            --ks noubti-test.jks \
            --ks-key-alias noubti \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Noubti-Pro-v0.2.apk \
            Noubti-Pro-v0.2-aligned.apk

          "$APKSIGNER" verify --verbose Noubti-Pro-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noubti-Pro-v0.2
          path: NoubtiProAndroid/Noubti-Pro-v0.2.apk
